<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.mono{font:600 17px Consolas,"Courier New",monospace;white-space:pre}
.show{opacity:0;animation:show .5s forwards}
@keyframes show{to{opacity:1}}
.cur{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
</style>
<rect width="1000" height="370" rx="14" fill="#1b1d1f"/>
<rect x="34" y="28" width="932" height="314" rx="12" fill="#252729" stroke="#3a3d40"/>
<rect x="34" y="28" width="932" height="34" rx="12" fill="#2e3134"/>
<rect x="34" y="50" width="932" height="12" fill="#2e3134"/>
<circle cx="60" cy="45" r="6" fill="#b5c0ca"/><circle cx="80" cy="45" r="6" fill="#b5c0ca" fill-opacity=".6"/><circle cx="100" cy="45" r="6" fill="#b5c0ca" fill-opacity=".3"/>
<text x="500" y="50" text-anchor="middle" style="font:600 14px Segoe UI,Arial,sans-serif" fill="#9aa1a8">Windows PowerShell 5.1 · PS HELP 1.0.0</text>
<text x="64" y="128" style="font:800 64px Segoe UI,Arial,sans-serif" fill="#b5c0ca">PS HELP</text>
<text x="66" y="170" style="font:500 22px Segoe UI,Arial,sans-serif" fill="#c7cbd0">PowerShell commands in one window · click instead of typing</text>
<line x1="64" y1="192" x2="936" y2="192" stroke="#3a3d40"/>
<text x="64" y="222" class="mono show" style="animation-delay:0.3s"><tspan fill="#b5c0ca">PS C:\Users\You&gt; </tspan><tspan fill="#e6e9ec">Start-Process "PS HELP.exe"</tspan></text>
<text x="64" y="250" class="mono show" style="animation-delay:1.5s"><tspan fill="#b5c0ca"></tspan><tspan fill="#e6e9ec">Loading 10 sections, 40+ cmdlets, 24 skins, 32 languages...</tspan></text>
<text x="64" y="278" class="mono show" style="animation-delay:2.7s"><tspan fill="#b5c0ca"></tspan><tspan fill="#e6e9ec">[ OK ] Get-Process  Get-Service  Get-ChildItem  Test-Connection</tspan></text>
<text x="64" y="306" class="mono show" style="animation-delay:3.9s"><tspan fill="#b5c0ca"></tspan><tspan fill="#e6e9ec">[ OK ] No console. No install. One window.</tspan></text>
<text x="64" y="334" class="mono show" style="animation-delay:5.2s"><tspan fill="#b5c0ca">PS C:\Users\You&gt; </tspan><tspan class="cur" fill="#e6e9ec">_</tspan></text>
